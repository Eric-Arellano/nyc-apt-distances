name: Tests
on: [pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
