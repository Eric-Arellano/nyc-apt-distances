# Vercel's Neon integration makes a `preview/<git branch>` Neon branch per PR, but deletes it only
# when Vercel deletes the deployment. Vercel's retention policy keeps the last 20 previews, so on
# Neon's free plan the 10-branch limit is hit first and preview builds fail. Deleting the branch
# when its PR closes keeps us under the limit.
#
# Needs the repo variable NEON_PROJECT_ID and the repo secret NEON_API_KEY.
name: Delete Neon preview branch

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Delete Neon preview branch
    # Fork PRs get no secrets and no Neon branch. The check is also a security boundary: the action
    # interpolates `branch` straight into a shell script, so a crafted branch name would run with
    # the API key. Only branches pushed by someone with write access may reach it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
