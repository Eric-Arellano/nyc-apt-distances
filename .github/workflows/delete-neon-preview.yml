# Vercel's Neon integration makes a `preview/<git branch>` Neon branch per PR, but deletes it only
# when Vercel deletes the deployment. Vercel's retention policy keeps the last 20 previews, so on
# Neon's free plan the 10-branch limit is hit first and preview builds fail. Deleting the branch
# when its PR closes keeps us under the limit.
#
# Needs the repo variable NEON_PROJECT_ID and the repo secret NEON_API_KEY.
#
# *Rejected: neondatabase/delete-branch-action, because two curl calls don't justify a dependency.*
name: Delete Neon preview branch

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Delete Neon preview branch
    # PRs from forks get no secrets, and get no Neon branch either.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # Through env, not interpolated into the script, because a branch name is user input.
          BRANCH: preview/${{ github.head_ref }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          auth="Authorization: Bearer $NEON_API_KEY"
          id=$(curl -fsS -H "$auth" "$api" | jq -r --arg name "$BRANCH" '.branches[] | select(.name == $name) | .id')
          if [ -z "$id" ]; then
            echo "No Neon branch named $BRANCH"
            exit 0
          fi
          curl -fsS -X DELETE -H "$auth" "$api/$id" > /dev/null
          echo "Deleted $BRANCH"
